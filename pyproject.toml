[project]
name = "weberpenn"
version = "0.1.0"
description = "Weber and Penn's tree model in one Python file, checked against weber-penn-net"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["weberpenn.py", "presets.json"]
